version: "3.8"

services:
  ai-coppermaker:
    build: .
    image: ai-copper-maker:latest
    container_name: ai-coppermaker
    restart: unless-stopped
    # Matches the actual one-true deployment: the container shares the host
    # network so it reaches the host-local AI stack directly (ollama on 11434,
    # llama.cpp on 8080, LM Studio on 1234) and holds 127.0.0.1:8081 itself,
    # exactly like the container launched with `docker run --network host`.
    network_mode: host
    environment:
      - OLLAMA_HOST=http://localhost:11434
      - LLAMA_CPP_HOST=http://localhost:8080
      - LMSTUDIO_HOST=http://localhost:1234
      - HOME=/home/nobara-user
      - PYTHONUNBUFFERED=1
    volumes:
      # Live source: backend + frontend edits appear without a rebuild (the
      # image only provides the Python packages). State stays on the host too.
      - /home/nobara-user/AI-Copper-Maker:/app
      - /home/nobara-user/.config/ai-copper-maker:/home/nobara-user/.config/ai-copper-maker