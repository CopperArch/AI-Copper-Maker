<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AI Copper Maker — your local AI coding studio">
  <defs>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C99A"/>
      <stop offset="45%" stop-color="#D98A4B"/>
      <stop offset="100%" stop-color="#A85C28"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221A14"/>
      <stop offset="100%" stop-color="#14100D"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)" stroke="#A85C28" stroke-opacity="0.35" stroke-width="2"/>

  <!-- mark (scaled 256 -> 192) -->
  <g transform="translate(56,64) scale(0.75)">
    <path d="M176 74 A 66 66 0 1 0 176 182"
          fill="none" stroke="url(#copper)" stroke-width="22" stroke-linecap="round"/>
    <rect x="182" y="120" width="20" height="20" rx="5" fill="url(#copper)"/>
    <rect x="212" y="102" width="13" height="13" rx="3.5" fill="#D98A4B"/>
    <rect x="214" y="136" width="9" height="9" rx="2.5" fill="#F3C99A"/>
    <path d="M70 56 L76 72 L92 78 L76 84 L70 100 L64 84 L48 78 L64 72 Z" fill="#F3C99A" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="138" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif"
        font-size="86" font-weight="800" fill="#F2E8DC" letter-spacing="2">AI
    <tspan fill="url(#copper)">COPPER</tspan> MAKER</text>

  <!-- tagline + divider -->
  <rect x="304" y="168" width="560" height="3" rx="1.5" fill="#A85C28" fill-opacity="0.5"/>
  <text x="300" y="216" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="500" fill="#C9B8A5" letter-spacing="1">Your local AI coding studio — plan it, build it, run it, ship it.</text>
</svg>
